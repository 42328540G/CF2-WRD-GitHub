[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf2wrd"
version = "1.1.0"
description = "Manuscript-aligned reference implementation of CF2-WRD for wheat stripe rust classification"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Bojian Guo"},
  {name = "Xin Li"},
  {name = "Temirbaeva Nazgul Ismanovna"}
]
dependencies = [
  "torch==2.1.0",
  "torchvision==0.16.0",
  "opencv-python==4.8.1.78",
  "scikit-learn==1.3.0",
  "matplotlib==3.8.0",
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<3.0",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "tqdm>=4.65"
]

[tool.setuptools]
packages = ["cf2wrd"]
